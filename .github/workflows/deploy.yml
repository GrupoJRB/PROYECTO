name: Continuous Deployment (CD)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  build-and-deploy:
    name: Build & Package Production Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Production JAR
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests -B
          JAR_FILE=$(find target -maxdepth 1 -name "*.jar" ! -name "*.original" | head -n 1)
          echo "JAR generado: $JAR_FILE"
          sha256sum "$JAR_FILE" > target/checksum.sha256
          cat target/checksum.sha256

      - name: Validate Production Docker Compose Config
        run: |
          docker compose -f despliegue/docker/docker-compose.prod.yml config

      - name: Build Production Docker Image
        run: |
          docker build -t travelink-app:${{ github.ref_name || 'latest' }} .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: travelink-production-jar
          path: |
            target/*.jar
            target/checksum.sha256
          retention-days: 7
